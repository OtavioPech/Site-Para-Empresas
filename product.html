<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes do produto - Sistema de anÃºncios.">
  <title>Produto - Sistema de AnÃºncios</title>
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    .produto-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--espaco-enorme);
      padding: var(--espaco-enorme) var(--espaco-grande);
      max-width: var(--largura-container);
      margin: 0 auto;
    }
    
    .produto-imagem {
      width: 100%;
      border-radius: var(--raio-grande);
      background-color: var(--cor-fundo-secundario);
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .produto-imagem img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .produto-detalhes {
      display: flex;
      flex-direction: column;
      gap: var(--espaco-grande);
    }
    
    .produto-titulo {
      font-size: var(--tamanho-fonte-titulo);
      font-weight: var(--peso-fonte-negrito);
    }
    
    .produto-categoria {
      display: inline-block;
      background-color: var(--cor-primaria-muito-claro);
      color: var(--cor-primaria);
      padding: var(--espaco-pequeno) var(--espaco-medio);
      border-radius: var(--raio-pequeno);
      width: fit-content;
    }
    
    .produto-descricao {
      font-size: var(--tamanho-fonte-normal);
      line-height: var(--altura-linha-normal);
      color: var(--cor-texto-secundario);
    }
    
    .produto-preco-container {
      padding: var(--espaco-grande);
      background-color: var(--cor-fundo-secundario);
      border-radius: var(--raio-grande);
    }
    
    .produto-preco {
      font-size: var(--tamanho-fonte-titulo);
      font-weight: var(--peso-fonte-negrito);
      color: var(--cor-primaria);
      margin-bottom: var(--espaco-pequeno);
    }
    
    .produto-preco-original {
      font-size: var(--tamanho-fonte-grande);
      color: var(--cor-texto-secundario);
      text-decoration: line-through;
      margin-right: var(--espaco-pequeno);
    }
    
    .produto-desconto {
      background-color: var(--cor-perigo);
      color: white;
      padding: 4px 8px;
      border-radius: var(--raio-pequeno);
      font-weight: var(--peso-fonte-negrito);
    }
    
    .produto-status {
      padding: var(--espaco-medio);
      background-color: var(--cor-aviso);
      color: var(--cor-texto-principal);
      border-radius: var(--raio-medio);
      text-align: center;
      font-weight: var(--peso-fonte-medio);
    }
    
    .produto-botoes {
      display: flex;
      gap: var(--espaco-medio);
      flex-wrap: wrap;
    }
    
    .produto-botoes .botao {
      flex: 1;
      min-width: 150px;
    }
    
    .secao-informacoes {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--espaco-grande);
      margin-top: var(--espaco-enorme);
      padding-top: var(--espaco-enorme);
      border-top: 1px solid var(--cor-borda);
    }
    
    .info-item h4 {
      font-size: var(--tamanho-fonte-pequeno);
      color: var(--cor-texto-secundario);
      text-transform: uppercase;
      margin-bottom: var(--espaco-pequeno);
    }
    
    .info-item p {
      font-size: var(--tamanho-fonte-grande);
      font-weight: var(--peso-fonte-medio);
    }
    
    @media (max-width: 768px) {
      .produto-container {
        grid-template-columns: 1fr;
        gap: var(--espaco-grande);
        padding: var(--espaco-grande) var(--espaco-pequeno);
      }
      
      .secao-informacoes {
        grid-template-columns: 1fr;
      }
    }
  </style>
  
</head>

<body>
  
  <header>
    <div class="header-conteudo">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" fill="#007BFF" rx="4"/>
          <circle cx="12" cy="12" r="6" fill="#FFFFFF"/>
          <circle cx="28" cy="12" r="6" fill="#FFFFFF"/>
          <rect x="10" y="22" width="20" height="12" fill="#FFFFFF" rx="2"/>
        </svg>
        <span>MeuSite</span>
      </div>
      <nav>
        <a href="index.html">InÃ­cio</a>
        <a href="products.html">Produtos</a>
        <a href="#contato">Contato</a>
      </nav>
    </div>
  </header>
  
  <main>
    
    <!-- ConteÃºdo do produto serÃ¡ preenchido por JavaScript -->
    <div id="conteudo-produto">
      <div class="container" style="text-align: center; padding: var(--espaco-enorme);">
        <p>Carregando produto...</p>
      </div>
    </div>
    
    <!-- Produtos relacionados -->
    <section class="container" style="padding: var(--espaco-enorme) var(--espaco-grande);">
      <h2 style="text-align: center; margin-bottom: var(--espaco-grande);">Outros Produtos</h2>
      <div id="produtos-relacionados" class="grid-produtos">
        <!-- Preenchido por JavaScript -->
      </div>
    </section>
    
  </main>
  
  <footer>
    <div class="footer-conteudo">
      <div class="footer-secao">
        <h3>Sobre</h3>
        <p>Sistema profissional para anÃºncios e venda de produtos.</p>
      </div>
      <div class="footer-secao">
        <h3>Links Ãšteis</h3>
        <a href="index.html">InÃ­cio</a>
        <a href="products.html">Produtos</a>
        <a href="admin.html" style="font-size: 12px; opacity: .75;">Acesso administrativo</a>
      </div>
      <div class="footer-secao">
        <h3>Contato</h3>
        <a href="mailto:contato@empresa.com">contato@empresa.com</a>
        <a href="tel:+5511999999999">(11) 99999-9999</a>
      </div>
    </div>
    <div class="footer-copyright">
      <p>&copy; 2024 Sua Empresa. Todos os direitos reservados.</p>
    </div>
  </footer>
  
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
  
  <script>
    /**
     * SCRIPT: PÃ¡gina Individual do Produto
     * 
     * ResponsÃ¡vel por:
     * - Pegar ID do produto da URL
     * - Carregar dados do produto
     * - Mostrar detalhes na tela
     * - Mostrar produtos relacionados
     */
    
    document.addEventListener('DOMContentLoaded', function() {
      // Pega o ID do produto da URL
      const idProduto = obterParametroURL('id');
      
      if (!idProduto) {
        mostrarErro('Produto nÃ£o especificado');
        return;
      }
      
      // Carrega o produto do armazenamento
      const produto = Storage.getProduct(parseInt(idProduto));
      
      if (!produto) {
        mostrarErro('Produto nÃ£o encontrado');
        return;
      }
      
      // Mostra o produto na tela
      mostrarProduto(produto);
      
      // Mostra produtos relacionados
      mostrarProdutosRelacionados(produto);
    });
    
    /**
     * FUNÃ‡ÃƒO: mostrarProduto()
     * 
     * O QUE FAZ:
     * Renderiza todos os detalhes do produto na tela
     */
    function mostrarProduto(produto) {
      const container = document.getElementById('conteudo-produto');
      
      // Calcula preÃ§o com desconto
      let precoHTML = `<span class="produto-preco">${CONFIG.formatCurrency(produto.preco)}</span>`;
      let statusHTML = '';
      
      if (produto.desconto && produto.desconto > 0) {
        const precoComDesconto = CONFIG.calculateDiscountedPrice(produto.preco, produto.desconto);
        precoHTML = `
          <div>
            <span class="produto-preco-original">${CONFIG.formatCurrency(produto.preco)}</span>
            <span class="produto-preco">${CONFIG.formatCurrency(precoComDesconto)}</span>
            <span class="produto-desconto">-${produto.desconto}%</span>
          </div>
        `;
      }
      
      if (produto.foraEstoque) {
        statusHTML = '<div class="produto-status">âš ï¸ Fora de Estoque</div>';
      }
      
      // Imagem
      const imagemHTML = produto.imagem ?
        `<img src="${produto.imagem}" alt="${produto.nome}">` :
        `<div style="color: var(--cor-texto-secundario);">Sem imagem disponÃ­vel</div>`;
      
      // Construir HTML
      container.innerHTML = `
        <div class="produto-container">
          <div class="produto-imagem">
            ${imagemHTML}
          </div>
          
          <div class="produto-detalhes">
            ${produto.categoria ? `<span class="produto-categoria">${produto.categoria}</span>` : ''}
            <h1 class="produto-titulo">${produto.nome}</h1>
            
            <p class="produto-descricao">${produto.descricao || 'Sem descriÃ§Ã£o disponÃ­vel'}</p>
            
            <div class="produto-preco-container">
              ${precoHTML}
            </div>
            
            ${statusHTML}
            
            <div class="produto-botoes">
              <a href="${CONFIG.getWhatsAppLink()}" class="botao botao-grande botao-sucesso">
                ðŸ’¬ Falar via WhatsApp
              </a>
              <button class="botao botao-grande botao-contorno" onclick="compartilharProduto()">
                ðŸ“¤ Compartilhar
              </button>
            </div>
          </div>
        </div>
      `;
      
      // InformaÃ§Ãµes adicionais
      if (produto.dataCriacao || produto.categoria) {
        const infoHTML = `
          <div class="secao-informacoes">
            ${produto.categoria ? `
              <div class="info-item">
                <h4>Categoria</h4>
                <p>${produto.categoria}</p>
              </div>
            ` : ''}
            
            ${produto.dataCriacao ? `
              <div class="info-item">
                <h4>Adicionado</h4>
                <p>${formatarData(produto.dataCriacao)}</p>
              </div>
            ` : ''}
          </div>
        `;
        
        container.innerHTML += infoHTML;
      }
    }
    
    /**
     * FUNÃ‡ÃƒO: mostrarProdutosRelacionados()
     * 
     * O QUE FAZ:
     * Carrega outros produtos da mesma categoria
     */
    function mostrarProdutosRelacionados(produtoAtual) {
      const container = document.getElementById('produtos-relacionados');
      const todos = Storage.getAllProducts();
      
      // Filtra produtos da mesma categoria (excluindo o atual)
      let relacionados = todos.filter(p => 
        p.id !== produtoAtual.id && 
        p.categoria === produtoAtual.categoria
      );
      
      // Se nÃ£o hÃ¡ da mesma categoria, pega aleatÃ³rios
      if (relacionados.length === 0) {
        relacionados = todos.filter(p => p.id !== produtoAtual.id).slice(0, 4);
      } else {
        relacionados = relacionados.slice(0, 4);
      }
      
      // Se nÃ£o hÃ¡ nenhum produto relacionado
      if (relacionados.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--cor-texto-secundario);">Nenhum outro produto disponÃ­vel</p>';
        return;
      }
      
      // Renderiza cada produto relacionado
      relacionados.forEach(produto => {
        const card = document.createElement('div');
        card.className = 'card-produto';
        
        const imagemHTML = produto.imagem ?
          `<img src="${produto.imagem}" alt="${produto.nome}" class="card-imagem">` :
          `<div class="card-imagem" style="background-color: var(--cor-fundo-secundario); display: flex; align-items: center; justify-content: center;"><span style="color: var(--cor-texto-secundario);">Sem imagem</span></div>`;
        
        let precoHTML = `<span class="card-preco">${CONFIG.formatCurrency(produto.preco)}</span>`;
        
        if (produto.desconto && produto.desconto > 0) {
          const precoComDesconto = CONFIG.calculateDiscountedPrice(produto.preco, produto.desconto);
          precoHTML = `
            <div>
              <span class="card-preco-original">${CONFIG.formatCurrency(produto.preco)}</span>
              <span class="card-preco">${CONFIG.formatCurrency(precoComDesconto)}</span>
              <span class="badge-desconto">-${produto.desconto}%</span>
            </div>
          `;
        }
        
        card.innerHTML = `
          ${imagemHTML}
          <div class="card-conteudo">
            <h3 class="card-titulo">${produto.nome}</h3>
            ${produto.categoria ? `<span class="card-categoria">${produto.categoria}</span>` : ''}
            <p class="card-descricao">${(produto.descricao || '').substring(0, 100)}...</p>
            ${precoHTML}
            <div class="card-botoes">
              <a href="product.html?id=${produto.id}" class="botao botao-pequeno" style="flex: 1; text-align: center;">Ver Detalhes</a>
              <a href="${CONFIG.getWhatsAppLink()}" class="botao botao-pequeno botao-sucesso" style="flex: 1; text-align: center;">ðŸ’¬</a>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }
    
    /**
     * FUNÃ‡ÃƒO: mostrarErro()
     * 
     * O QUE FAZ:
     * Mostra mensagem de erro quando produto nÃ£o existe
     */
    function mostrarErro(mensagem) {
      document.getElementById('conteudo-produto').innerHTML = `
        <div class="container" style="text-align: center; padding: var(--espaco-enorme);">
          <h2>âŒ ${mensagem}</h2>
          <p style="color: var(--cor-texto-secundario); margin-top: var(--espaco-grande);">
            O produto que vocÃª procura nÃ£o foi encontrado.
          </p>
          <a href="products.html" class="botao" style="display: inline-block; margin-top: var(--espaco-grande);">
            â† Voltar para Produtos
          </a>
        </div>
      `;
    }
    
    /**
     * FUNÃ‡ÃƒO: compartilharProduto()
     * 
     * O QUE FAZ:
     * Compartilha o link do produto
     */
    function compartilharProduto() {
      const url = window.location.href;
      
      if (navigator.share) {
        navigator.share({
          title: 'Confira este produto!',
          url: url
        }).catch(err => console.log('Erro ao compartilhar:', err));
      } else {
        copiarParaClipboard(url);
      }
    }
  </script>
  
</body>
</html>
